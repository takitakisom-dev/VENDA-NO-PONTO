<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TAKI VENDAS PRO</title>
<meta name="theme-color" content="#174ea6">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f1f5f9}
.top{background:#174ea6;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.hamb{font-size:24px;background:rgba(255,255,255,.15);border:none;color:#fff;width:42px;height:42px;border-radius:10px}
.side{position:fixed;left:-300px;top:0;width:280px;height:100%;background:#fff;z-index:200;transition:.3s;box-shadow:4px 0 20px rgba(0,0,0,.2);overflow:auto}
.side.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:none}
.overlay.open{display:block}
.side-header{background:#174ea6;color:#fff;padding:20px}
.menu-item{padding:14px 20px;display:flex;gap:12px;cursor:pointer;border-bottom:1px solid #f1f5f9;font-weight:700;color:#334155}
.menu-item.active{background:#dbeafe;color:#174ea6;border-left:4px solid #174ea6}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prod{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:8px 0;background:#fff}
.add{background:#174ea6;color:#fff;border:none;width:50px;height:50px;border-radius:12px;font-size:28px;font-weight:900}
.final{background:#174ea6;color:#fff;width:100%;padding:16px;border-radius:12px;border:none;font-size:18px;font-weight:900}
.final:disabled{background:#94a3b8}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0}
.hidden{display:none!important}
.label{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin-top:8px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="login" class="card" style="max-width:420px;margin:30px auto;text-align:center">
<h2>🔥 TAKI VENDAS PRO</h2><p style="color:#174ea6;font-weight:800">CORRIGIDO - Carrinho 100%</p>
<p id="fbStatus" style="background:#f1f5f9;padding:8px;border-radius:8px;font-size:12px">Conectando...</p>
<input id="lojaId" value="LOJA-CARAGUA-01" style="font-weight:900;text-align:center">
<select id="caixaId"><option value="ADMIN">👑 ADMIN</option><option value="CAIXA_01">CAIXA 01</option><option value="CAIXA_02">CAIXA 02</option><option value="CAIXA_03">CAIXA 03</option><option value="CAIXA_04">CAIXA 04</option></select>
<button onclick="entrar()" class="final" style="margin-top:12px">🚀 ENTRAR</button>
<button onclick="localStorage.clear();alert('Limpo! Entre de novo');" style="margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid #fecaca;background:#fff;color:#b91c1c">🧹 Limpar cache se bugou</button>
</div>
<div id="app" style="display:none">
<div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="hamb" onclick="toggleMenu()">☰</button><b>🏪 TAKI VENDAS PRO</b></div><span id="labelCaixa" style="background:rgba(255,255,255,.2);padding:6px 10px;border-radius:20px;font-size:11px"></span></div>
<div style="background:#174ea6;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;font-size:12px"><span id="labelLoja"></span><span>R$ <span id="fatTop">0,00</span> hoje</span></div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="side" id="sideMenu">
<div class="side-header"><h3 style="margin:0">TAKI VENDAS PRO</h3><small id="sideLoja"></small><br><small id="sideCaixa"></small></div>
<div class="menu-item active" onclick="ir('pdv',this)"><span>🛒</span> PDV</div>
<div class="menu-item" onclick="ir('produtos',this)"><span>📦</span> Produtos</div>
<div class="menu-item" onclick="ir('balanca',this)"><span>⚖️</span> Balança</div>
<div class="menu-item" onclick="ir('caixa',this)"><span>💰</span> Caixa</div>
<div class="menu-item" onclick="ir('relatorios',this)"><span>📈</span> Relatórios</div>
<div class="menu-item" onclick="ir('admin',this)" id="itemAdmin" style="display:none;background:#dcfce7"><span>👑</span> Admin</div>
</div>
<div id="aba-pdv" class="aba"><div class="card"><h3>Produtos</h3><input id="buscaProd" placeholder="🔍 Buscar..." onkeyup="renderProdutos()"><div id="listaProdutos"></div></div><div class="card" style="border:2px solid #174ea6"><h3>🛒 Venda <span id="numVenda">0</span></h3><div id="carrinho" style="margin:12px 0;min-height:50px;border:1px dashed #cbd5e1;border-radius:10px;padding:10px"></div><h2 style="text-align:right;color:#174ea6">TOTAL R$ <span id="total">0.00</span></h2><select id="pagamento"><option>💵 Dinheiro</option><option>⚡ Pix</option><option>💳 Cartão</option><option>🧾 Fiado</option></select><button id="btnFinalizar" class="final" style="margin-top:10px" onclick="finalizar()">✓ FINALIZAR VENDA</button></div></div>
<div id="aba-produtos" class="aba hidden"><div class="card"><h3>📦 Produtos</h3><input id="pNome" placeholder="Nome"><div class="row"><div><input id="pPreco" type="number" step="0.01" placeholder="Preço"></div><div><input id="pEstoque" type="number" value="100" placeholder="Estoque"></div></div><label style="display:flex;gap:8px;margin:10px 0;font-weight:700;background:#dbeafe;padding:10px;border-radius:10px"><input type="checkbox" id="pPorPeso" style="width:20px"> ⚖️ Por peso Kg</label><button class="final" onclick="salvarProduto()">💾 Salvar</button><div id="listaCadastroProdutos"></div></div></div>
<div id="aba-balanca" class="aba hidden"><div class="card"><h3>⚖️ Balança</h3><h1 id="pesoDisplay" style="font-size:48px;text-align:center;color:#174ea6">0.000</h1><div style="display:flex;gap:6px;justify-content:center"><button onclick="setPeso(0.25)" style="padding:10px;border-radius:8px">0.25</button><button onclick="setPeso(0.5)" style="padding:10px;border-radius:8px">0.5</button><button onclick="setPeso(1)" style="padding:10px;border-radius:8px">1kg</button><button onclick="setPeso(0)" style="padding:10px;background:#fee2e2">Zerar</button></div><input id="pesoManual" type="number" step="0.001" placeholder="Peso 0.750" oninput="pesoAtual=this.valueAsNumber||0;document.getElementById('pesoDisplay').innerText=(pesoAtual||0).toFixed(3);calcBalanca()"><select id="produtoBalanca"></select><h2 style="text-align:center;color:#22c55e">R$ <span id="totalBalanca">0.00</span></h2><button class="final" onclick="addBalanca()">➕ Jogar pro PDV</button></div></div>
<div id="aba-caixa" class="aba hidden"><div class="card"><h3>💰 Caixa</h3><div id="resumoCaixa"></div><div id="historicoCaixa"></div></div></div>
<div id="aba-relatorios" class="aba hidden"><div class="card"><h3>📈 Relatórios</h3><h3 id="relFat">R$ 0,00</h3><div id="relPag"></div></div></div>
<div id="aba-admin" class="aba hidden"><div class="card"><h3>👑 Admin</h3><h2 id="adminFatTotal">R$ 0,00</h2><div id="adminAoVivo"></div></div></div>
</div>
<script>
if(!localStorage.getItem('taki_v2_fix')){localStorage.clear();localStorage.setItem('taki_v2_fix','1');}
const firebaseConfig={apiKey:"AIzaSyCUAnzfTlUeEEN6bXL-rSPWzudobwdEeUI",authDomain:"venda-no-ponto.firebaseapp.com",databaseURL:"https://venda-no-ponto-default-rtdb.firebaseio.com",projectId:"venda-no-ponto",storageBucket:"venda-no-ponto.firebasestorage.app",messagingSenderId:"891438595344",appId:"1:891438595344:web:eac019ede805eb4240f995"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let LOJA="",CAIXA="",produtos=[{id:"coxinha",nome:"Salgados congelados coxinha",preco:5,estoque:100,cat:"Salgados",porPeso:false,custo:2.5}],clientes=[{nome:"Avulso"}],fornecedores=[],vendasLocais=JSON.parse(localStorage.getItem("vp_vendas")||"[]"),carrinho=[],pesoAtual=0;
function saveLocal(){localStorage.setItem("vp_vendas",JSON.stringify(vendasLocais));}
function entrar(){LOJA=document.getElementById("lojaId").value.trim().toUpperCase()||"LOJA-CARAGUA-01";CAIXA=document.getElementById("caixaId").value;document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("labelCaixa").innerText=CAIXA;document.getElementById("labelLoja").innerText=LOJA;document.getElementById("sideLoja").innerText=LOJA;document.getElementById("sideCaixa").innerText=CAIXA;if(CAIXA==="ADMIN")document.getElementById("itemAdmin").style.display="flex";renderProdutos();atualizarSelectBalanca();escutarFirebase();renderRelatorios();}
function toggleMenu(){document.getElementById("sideMenu").classList.toggle("open");document.getElementById("overlay").classList.toggle("open");}
function ir(nome,el){document.querySelectorAll(".aba").forEach(a=>a.classList.add("hidden"));document.getElementById("aba-"+nome).classList.remove("hidden");document.querySelectorAll(".menu-item").forEach(m=>m.classList.remove("active"));el.classList.add("active");toggleMenu();}
function renderProdutos(){let busca=(document.getElementById("buscaProd")?.value||"").toLowerCase();let div=document.getElementById("listaProdutos");let lista=produtos.filter(p=>p.nome.toLowerCase().includes(busca));div.innerHTML=lista.map(p=>`<div class="prod"><div style="flex:1"><b>${p.nome}</b> <small>(${p.estoque})</small><br><b style="color:#174ea6">R$ ${Number(p.preco).toFixed(2)}</b></div><button class="add" onclick="addCarrinho('${p.id}')">+</button></div>`).join("");}
function addCarrinho(id){let p=produtos.find(x=>String(x.id)===String(id));if(!p){alert("Produto não encontrado");return}if(p.porPeso){ir('balanca',document.querySelectorAll('.menu-item')[2]);document.getElementById("produtoBalanca").value=id;calcBalanca();return}let existente=carrinho.find(x=>String(x.id)===String(p.id));if(existente){existente.qtd++;}else{carrinho.push({id:String(p.id),nome:p.nome,preco:Number(p.preco),qtd:1});}renderCarrinho();if(navigator.vibrate)navigator.vibrate(50);}
function renderCarrinho(){let div=document.getElementById("carrinho");let btn=document.getElementById("btnFinalizar");if(carrinho.length===0){div.innerHTML="<div style='text-align:center;color:#94a3b8;padding:10px'>Carrinho vazio<br><small>Clique no + azul</small></div>";btn.disabled=true;document.getElementById("total").innerText="0.00";document.getElementById("numVenda").innerText="0";return}div.innerHTML=carrinho.map((item,idx)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><div><b>${item.nome}</b><br><small>R$ ${item.preco.toFixed(2)} x ${item.qtd}</small></div><div style="display:flex;gap:8px;align-items:center"><b>R$ ${(item.preco*item.qtd).toFixed(2)}</b><button onclick="remCarrinho(${idx})" style="background:#fee2e2;border:none;border-radius:8px;padding:8px 12px">🗑️</button></div></div>`).join("");let total=carrinho.reduce((s,i)=>s+i.preco*i.qtd,0);document.getElementById("total").innerText=total.toFixed(2);document.getElementById("numVenda").innerText=carrinho.reduce((s,i)=>s+i.qtd,0);btn.disabled=false;}
function remCarrinho(idx){carrinho.splice(idx,1);renderCarrinho();}
function finalizar(){if(carrinho.length===0){alert("Carrinho vazio! Clique no + azul");return}let total=carrinho.reduce((s,i)=>s+i.preco*i.qtd,0);let btn=document.getElementById("btnFinalizar");btn.disabled=true;btn.innerText="⏳ Salvando...";let venda={caixaId:CAIXA,lojaId:LOJA,total:total,produtos:JSON.parse(JSON.stringify(carrinho)),pagamento:document.getElementById("pagamento").value,data:new Date().toISOString(),hora:new Date().toLocaleTimeString("pt-BR"),timestamp:Date.now(),idLocal:Date.now().toString()};vendasLocais.unshift(venda);saveLocal();db.ref(`lojas/${LOJA}/vendas`).push(venda).then(()=>{alert("✅ Venda R$ "+total.toFixed(2)+" finalizada!");carrinho=[];renderCarrinho();renderRelatorios();btn.disabled=false;btn.innerText="✓ FINALIZAR VENDA";}).catch(()=>{alert("✅ Venda salva local R$ "+total.toFixed(2));carrinho=[];renderCarrinho();renderRelatorios();btn.disabled=false;btn.innerText="✓ FINALIZAR VENDA";});}
function setPeso(v){pesoAtual=v;document.getElementById("pesoDisplay").innerText=v.toFixed(3);document.getElementById("pesoManual").value=v;calcBalanca();}
function calcBalanca(){let sel=document.getElementById("produtoBalanca");if(!sel||!sel.value)return;let prod=produtos.find(p=>String(p.id)===String(sel.value));if(!prod)return;document.getElementById("totalBalanca").innerText=(pesoAtual*prod.preco).toFixed(2);}
function addBalanca(){let sel=document.getElementById("produtoBalanca");let prod=produtos.find(p=>String(p.id)===String(sel.value));if(!prod||pesoAtual<=0)return;carrinho.push({id:prod.id+"-"+Date.now(),nome:prod.nome+" ("+pesoAtual.toFixed(3)+"kg)",preco:prod.preco*pesoAtual,qtd:1});renderCarrinho();ir('pdv',document.querySelectorAll('.menu-item')[0]);setPeso(0);}
function atualizarSelectBalanca(){let sel=document.getElementById("produtoBalanca");if(!sel)return;let lista=produtos.filter(p=>p.porPeso);if(lista.length===0)lista=produtos;sel.innerHTML=lista.map(p=>`<option value="${p.id}">${p.nome} - R$ ${p.preco.toFixed(2)}</option>`).join("");}
function salvarProduto(){let nome=document.getElementById("pNome").value.trim();let preco=parseFloat(document.getElementById("pPreco").value)||0;let estoque=parseInt(document.getElementById("pEstoque").value)||0;if(!nome||preco<=0)return;let prod={id:Date.now().toString(),nome,preco,estoque,porPeso:document.getElementById("pPorPeso").checked};produtos.unshift(prod);db.ref(`lojas/${LOJA}/produtos/${prod.id}`).set(prod);renderProdutos();}
function renderRelatorios(){let hoje=vendasLocais.filter(v=>new Date(v.data).toDateString()===new Date().toDateString());let fat=hoje.reduce((s,v)=>s+v.total,0);document.getElementById("fatTop").innerText=fat.toFixed(2);document.getElementById("relFat").innerText="R$ "+fat.toFixed(2);document.getElementById("adminFatTotal").innerText="R$ "+fat.toFixed(2);}
function escutarFirebase(){db.ref(`lojas/${LOJA}/produtos`).on("value",snap=>{if(!snap.exists())return;let lista=[];snap.forEach(c=>lista.push(c.val()));if(lista.length>0){produtos=lista;renderProdutos();}});db.ref(`lojas/${LOJA}/vendas`).limitToLast(100).on("value",snap=>{let lista=[];snap.forEach(c=>lista.push(c.val()));lista.forEach(vfb=>{if(!vendasLocais.find(v=>Math.abs((v.timestamp||0)-(vfb.timestamp||0))<2000 && v.total===vfb.total))vendasLocais.push(vfb);});vendasLocais.sort((a,b)=>b.timestamp-a.timestamp);saveLocal();renderRelatorios();});}
</script>
</body>
</html>
