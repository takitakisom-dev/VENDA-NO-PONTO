<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TAKI VENDAS PRO V24 - DADOS DA EMPRESA + NOTA PAULISTA</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href='data:application/manifest+json,{"name":"Taki V24","short_name":"Taki V24","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a"}'>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f1f5f9}
.top{background:#0f172a;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.hamb{font-size:22px;background:rgba(255,255,255,.12);border:none;color:#fff;width:40px;height:40px;border-radius:10px}
.side{position:fixed;left:-310px;top:0;width:300px;height:100%;background:#fff;z-index:200;transition:.25s;box-shadow:4px 0 24px rgba(0,0,0,.3);overflow:auto;padding-bottom:20px}
.side.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:none}
.overlay.open{display:block}
.side-header{background:#0f172a;color:#fff;padding:18px}
.menu-item{padding:14px 20px;display:flex;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid #f1f5f9;font-weight:700;color:#334155;font-size:14px}
.menu-item.active{background:#dbeafe;color:#0f172a;border-left:4px solid #0f172a}
.card{background:#fff;border-radius:14px;padding:12px;margin:8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prod{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:6px 0;background:#fff}
.add{background:#0f172a;color:#fff;border:none;width:48px;height:48px;border-radius:12px;font-size:26px;font-weight:900}
.final{background:#16a34a;color:#fff;width:100%;padding:16px;border-radius:12px;border:none;font-size:18px;font-weight:900;box-shadow:0 4px 0 #14532d}
.cancel{background:#dc2626;color:#fff;border:none;width:100%;padding:14px;border-radius:12px;font-weight:900;margin-top:8px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0;font-size:16px}
.hidden{display:none!important}
.label{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;margin-top:12px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.offline-bar{padding:7px;text-align:center;font-size:11px;font-weight:800}
.offline-bar.on{background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:14px}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:520px;border-radius:16px;padding:18px;max-height:95vh;overflow:auto}
.pdv-layout{display:grid;grid-template-columns:1fr 390px;gap:8px}
@media(max-width:1024px){.pdv-layout{grid-template-columns:1fr}}
.teclado-box{background:#0f172a;border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:sticky;top:62px;display:block!important}
.teclado-display{background:#020617;color:#22c55e;border:3px inset #1e293b;border-radius:14px;padding:12px;margin-bottom:12px;text-align:right;font-family:'Courier New',monospace}
.teclado-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tecla{background:#1e293b;color:#fff;border:none;border-bottom:5px solid #020617;border-radius:14px;padding:20px 8px;font-size:26px;font-weight:900;min-height:72px}
.tecla.verde{background:#16a34a;border-bottom-color:#052e16}
.tecla.verde-grande{grid-column:span 3;background:#16a34a;border-bottom-color:#052e16;font-size:20px;padding:18px;min-height:64px}
.tecla.vermelha{background:#dc2626;border-bottom-color:#450a0a}
.tecla.laranja{background:#f59e0b;border-bottom-color:#78350f;color:#000}
.tecla.cinza{background:#334155;border-bottom-color:#0f172a}
.prod-codigo{background:#0f172a;color:#4ade80;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:900;margin-right:6px;font-family:monospace;border:1px solid #22c55e}
.btn-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.btn-quick button{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:8px 4px;font-size:11px;font-weight:800}
.recibo{font-family:'Courier New',monospace;background:#fff;color:#000;padding:12px;border:1px dashed #000;max-width:360px;margin:auto}
.recibo hr{border:none;border-top:1px dashed #000;margin:8px 0}
.recibo .linha{display:flex;justify-content:space-between}
.social{font-size:11px;text-align:center;background:#f8fafc;padding:8px;border-radius:8px;margin-top:6px}
.input-icon{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:0 12px;margin:6px 0}
.input-icon span{font-size:20px;min-width:28px;text-align:center}
.input-icon input{border:none;margin:0;padding:14px 0;flex:1;font-size:15px}
.grupo-empresa{background:#fff;border:2px solid #f59e0b;border-radius:16px;padding:14px;margin:8px 0}
.grupo-rede{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin:8px 0}
.instalar-btn{background:linear-gradient(135deg,#0f172a,#1e293b);color:#4ade80;border:2px solid #22c55e;padding:14px;border-radius:12px;width:100%;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #020617}
.pulse-install{animation:pulseInstall 2s infinite}
@keyframes pulseInstall{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.7)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.tipo-badge{padding:3px 8px;border-radius:8px;font-size:10px;font-weight:900}
.tipo-master{background:#dcfce7;color:#166534;border:1px solid #22c55e}
.tipo-simples{background:#dbeafe;color:#1e40af;border:1px solid #60a5fa}
.nfp-box{background:#fef3c7;border:2px solid #f59e0b;border-radius:12px;padding:12px;margin:8px 0}
.nfp-box.ativo{background:#dcfce7;border-color:#22c55e}
</style>
</head>
