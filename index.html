<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Venda no Ponto PRO 15.0 MULTI</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f1f5f9;padding:8px}
.top{background:#174ea6;color:#fff;border-radius:16px;padding:12px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:#fff;color:#174ea6;margin-right:6px}
.tab{padding:10px 18px;border-radius:20px;border:1px solid #cbd5e1;background:#fff;font-weight:700;margin-right:6px}
.tab.active{background:#174ea6;color:#fff}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prod{display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin:8px 0}
.add{background:#174ea6;color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:20px}
.final{background:#174ea6;color:#fff;width:100%;padding:14px;border-radius:12px;border:none;font-size:18px;font-weight:800}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900;background:#22c55e}
.live{animation:pulse 1s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0}
</style>
</head>
<body>

<div id="login" class="card" style="max-width:420px;margin:40px auto;text-align:center">
<h2>🔥 Venda no Ponto PRO 15.0</h2>
<p id="fbStatus">Conectando Firebase...</p>
<input id="lojaId" value="LOJA-CARAGUA-01" style="font-weight:900;text-align:center">
<select id="caixaId"><option value="ADMIN">👑 ADMIN CENTRAL</option><option value="CAIXA_01">CAIXA 01</option><option value="CAIXA_02">CAIXA 02</option><option value="CAIXA_03">CAIXA 03</option><option value="CAIXA_04">CAIXA 04</option></select>
<button onclick="entrar()" class="final" style="margin-top:10px">ENTRAR AO VIVO</button>
</div>

<div id="app" style="display:none">
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center">
<b>🏪 Venda no Ponto PRO</b><span style="background:#ffffff33;padding:4px 10px;border-radius:20px;font-size:12px"><span class="live">●</span> <span id="labelCaixa">CAIXA 01</span> - AO VIVO</span>
</div>
<div style="margin-top:8px"><button class="btn">Abrir Caixa</button><button class="btn">Fechar</button><button onclick="location.reload()" class="btn">Sair</button></div>
<div id="adminBar" style="display:none;margin-top:10px;background:#0f172a;padding:10px;border-radius:10px">👑 ADMIN: <b id="fat">R$ 0,00</b> hoje - <span id="qtdVendas">0 vendas</span> - Loja: <span id="labelLoja"></span></div>
</div>

<div style="display:flex;overflow:auto;padding:8px 0">
<button class="tab active">🛒 PDV</button><button class="tab">📦 Estoque</button><button class="tab">👥 Clientes</button>
</div>

<div class="card">
<h3 style="margin:0 0 8px">Produtos</h3>
<input placeholder="Buscar..." onkeyup="buscar(this.value)">
<div id="listaProdutos"></div>
</div>

<div class="card">
<h3>🛒 Venda <span id="numVenda">0</span> | <select id="cliente" style="width:120px;display:inline"><option>Avulso</option></select> <span style="float:right" id="sincStatus"></span></h3>
<div id="carrinho"></div>
<h2 style="text-align:right;color:#174ea6">TOTAL R$ <span id="total">0.00</span></h2>
<button class="final" onclick="finalizar()">✓ Finalizar</button>
<button style="width:100%;margin-top:8px;padding:12px;border-radius:10px;border:1px solid #174ea6;background:#fff;color:#174ea6;font-weight:700" onclick="limpar()">Limpar</button>
</div>

<div id="painelAdmin" class="card" style="display:none;border:2px solid #22c55e">
<h3>🔴 Ao Vivo - Todos os Caixas</h3>
<div id="aoVivo"></div>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCUAnzfTlUeEEN6bXL-rSPWzudobwdEeUI",
  authDomain: "venda-no-ponto.firebaseapp.com",
  databaseURL: "https://venda-no-ponto-default-rtdb.firebaseio.com",
  projectId: "venda-no-ponto",
  storageBucket: "venda-no-ponto.firebasestorage.app",
  messagingSenderId: "891438595344",
  appId: "1:891438595344:web:eac019ede805eb4240f995"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let LOJA="",CAIXA="",produtos=[{id:1,nome:"Coca-Cola 350ml",preco:5.00,estoque:20},{id:2,nome:"Pão de Queijo",preco:4.50,estoque:15}],carrinho=[],total=0;

firebase.database().ref(".info/connected").on("value",s=>{
 document.getElementById("fbStatus").innerHTML=s.val()?"🟢 Firebase AO VIVO conectado!":"🔴 Offline";
});

function entrar(){
 LOJA=document.getElementById("lojaId").value.toUpperCase();
 CAIXA=document.getElementById("caixaId").value;
 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 document.getElementById("labelCaixa").innerText=CAIXA;
 document.getElementById("labelLoja").innerText=LOJA;
 if(CAIXA==="ADMIN"){document.getElementById("adminBar").style.display="block";document.getElementById("painelAdmin").style.display="block";}
 renderProdutos(); escutar();
}
function renderProdutos(filtro=""){
 const div=document.getElementById("listaProdutos");
 let lista=produtos.filter(p=>p.nome.toLowerCase().includes(filtro.toLowerCase()));
 div.innerHTML=lista.map(p=>`<div class="prod"><div><b>${p.nome}</b> <small>(${p.estoque})</small><br><span style="color:#174ea6">R$ ${p.preco.toFixed(2)}</span></div><button class="add" onclick="add(${p.id})">+</button></div>`).join("");
}
function buscar(v){renderProdutos(v)}
function add(id){
 let p=produtos.find(x=>x.id===id);
 if(p.estoque<=0){alert("Sem estoque");return}
 let item=carrinho.find(x=>x.id===id);
 if(item) item.qtd++; else carrinho.push({...p,qtd:1});
 p.estoque--; renderProdutos(); renderCarrinho();
}
function renderCarrinho(){
 let div=document.getElementById("carrinho");
 div.innerHTML=carrinho.map(i=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>${i.nome} x${i.qtd}</span><span>R$ ${(i.preco*i.qtd).toFixed(2)} <button onclick="rem(${i.id})" style="margin-left:6px">x</button></span></div>`).join("")||"<small style='color:#94a3b8'>Carrinho vazio</small>";
 total=carrinho.reduce((s,i)=>s+i.preco*i.qtd,0);
 document.getElementById("total").innerText=total.toFixed(2);
 document.getElementById("numVenda").innerText=carrinho.length;
}
function rem(id){
 let i=carrinho.find(x=>x.id===id); let p=produtos.find(x=>x.id===id);
 p.estoque+=i.qtd; carrinho=carrinho.filter(x=>x.id!==id); renderProdutos(); renderCarrinho();
}
function limpar(){ carrinho.forEach(i=>{let p=produtos.find(x=>x.id===i.id);p.estoque+=i.qtd}); carrinho=[]; renderProdutos(); renderCarrinho(); }
function finalizar(){
 if(carrinho.length===0){alert("Carrinho vazio");return}
 let venda={caixaId:CAIXA,lojaId:LOJA,produtos:carrinho,total:total,cliente:document.getElementById("cliente").value,data:new Date().toISOString(),hora:new Date().toLocaleTimeString("pt-BR"),timestamp:Date.now()};
 document.getElementById("sincStatus").innerText="⏳ Sincronizando...";
 db.ref(`lojas/${LOJA}/vendas`).push(venda).then(()=>{
   document.getElementById("sincStatus").innerText="✅ Ao vivo!";
   setTimeout(()=>document.getElementById("sincStatus").innerText="",2000);
   carrinho=[]; renderCarrinho();
 });
}
function escutar(){
 db.ref(`lojas/${LOJA}/vendas`).orderByChild("timestamp").limitToLast(20).on("value",snap=>{
   let vendas=[];snap.forEach(c=>vendas.push(c.val()));vendas.reverse();
   if(CAIXA==="ADMIN"){
     let hoje=vendas.filter(v=>new Date(v.data).toDateString()===new Date().toDateString());
     let fat=hoje.reduce((s,v)=>s+v.total,0);
     document.getElementById("fat").innerText="R$ "+fat.toFixed(2);
     document.getElementById("qtdVendas").innerText=hoje.length+" vendas";
     document.getElementById("aoVivo").innerHTML=vendas.map(v=>`<div style="padding:8px;background:#f8fafc;margin:5px 0;border-radius:8px;border-left:4px solid #22c55e"><b>${v.caixaId}</b> - R$ ${v.total.toFixed(2)} às ${v.hora}<br><small>${v.produtos?.map(p=>p.nome+" x"+p.qtd).join(", ")}</small></div>`).join("");
   }
 });
}
</script>
</body>
</html>
