<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venda no Ponto</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f0f4f8;padding:10px}
.header{background:#174ea6;color:white;padding:15px 20px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.container{display:grid;grid-template-columns:1fr 380px;gap:12px;margin-top:12px}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:12px 0}
.produto{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px}
.btn-add{background:#174ea6;color:white;border:0;width:36px;height:36px;border-radius:8px;font-size:20px}
.total{font-size:28px;font-weight:800;color:#174ea6;text-align:right;margin:14px 0}
.btn-final{background:#174ea6;color:white;width:100%;padding:16px;border-radius:12px;border:0;font-size:18px;font-weight:700}
.btn-sec{width:100%;padding:12px;border-radius:10px;border:1px solid #174ea6;background:white;color:#174ea6;margin-top:8px;font-weight:600}
.input-prod{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin:4px 0}
</style>
</head>
<body>
<div class="header"><h1>🏪 Venda no Ponto</h1><span id="totalVendasDia"></span></div>
<div class="container">
<div class="card">
<h3>📦 Produtos</h3>
<input id="busca" class="search" placeholder="Buscar produto..." onkeyup="render()">
<div id="listaProdutos"></div>
<hr style="margin:16px 0">
<h4>+ Cadastrar Produto</h4>
<input id="nome" class="input-prod" placeholder="Nome ex: Coca 350ml">
<input id="preco" class="input-prod" type="number" step="0.01" placeholder="Preço ex: 5.00">
<button onclick="addProduto()" class="btn-sec">Salvar Produto</button>
</div>
<div class="card">
<h3>🛒 Carrinho <span id="qtd">0</span></h3>
<div id="carrinho" style="margin-top:12px;min-height:120px"></div>
<div class="total">TOTAL: <span id="total">R$ 0,00</span></div>
<button class="btn-final" onclick="finalizar()">✓ Finalizar Venda</button>
<button class="btn-sec" onclick="limpar()">Limpar</button>
<button class="btn-sec" onclick="zap()">📱 Enviar no Zap</button>
</div>
</div>
<script>
let produtos=JSON.parse(localStorage.getItem('vp_produtos')||'[{"nome":"Coca-Cola 350ml","preco":5},{"nome":"Pão de Queijo","preco":4.5},{"nome":"Água 500ml","preco":3},{"nome":"Chocolate 80g","preco":7.5}]');
let carrinho=[];let vendasDia=parseFloat(localStorage.getItem('vp_vendasDia')||'0');
function save(){localStorage.setItem('vp_produtos',JSON.stringify(produtos));localStorage.setItem('vp_vendasDia',vendasDia)}
function render(){let b=document.getElementById('busca').value.toLowerCase();let l=document.getElementById('listaProdutos');l.innerHTML='';produtos.filter(p=>p.nome.toLowerCase().includes(b)).forEach((p,i)=>{l.innerHTML+=`<div class="produto"><div><b>${p.nome}</b><br><span style="color:#174ea6">R$ ${p.preco.toFixed(2)}</span></div><button class="btn-add" onclick="addCarrinho(${i})">+</button></div>`});document.getElementById('totalVendasDia').innerText='Hoje: R$ '+vendasDia.toFixed(2);}
function renderCarrinho(){let d=document.getElementById('carrinho');d.innerHTML='';let t=0;carrinho.forEach((c,idx)=>{let s=c.preco*c.qtd;t+=s;d.innerHTML+=`<div style="display:flex;justify-content:space-between;margin:8px 0"><span>${c.qtd}x ${c.nome}</span><span>R$ ${s.toFixed(2)} <button onclick="remove(${idx})">x</button></span></div>`});document.getElementById('total').innerText='R$ '+t.toFixed(2);document.getElementById('qtd').innerText=carrinho.reduce((s,c)=>s+c.qtd,0);}
function addProduto(){let n=document.getElementById('nome').value;let p=parseFloat(document.getElementById('preco').value);if(!n||!p)return alert('Preencha');produtos.push({nome:n,preco:p});save();render();document.getElementById('nome').value='';document.getElementById('preco').value='';}
function addCarrinho(i){let prod=produtos[i];let ex=carrinho.find(c=>c.nome===prod.nome);if(ex)ex.qtd++;else carrinho.push({...prod,qtd:1});renderCarrinho();}
function remove(idx){carrinho.splice(idx,1);renderCarrinho()}function limpar(){carrinho=[];renderCarrinho()}
function finalizar(){if(carrinho.length==0)return alert('Vazio');let tot=carrinho.reduce((s,c)=>s+c.preco*c.qtd,0);vendasDia+=tot;save();render();alert('Venda R$ '+tot.toFixed(2)+' finalizada!');limpar();}
function zap(){if(carrinho.length==0)return alert('Vazio');let tot=carrinho.reduce((s,c)=>s+c.preco*c.qtd,0);let msg=`*Venda no Ponto*%0A%0A`;carrinho.forEach(c=>{msg+=`${c.qtd}x ${c.nome} - R$ ${(c.preco*c.qtd).toFixed(2)}%0A`});msg+=`%0A*TOTAL: R$ ${tot.toFixed(2)}*`;window.open('https://wa.me/?text='+msg,'_blank');}
render();renderCarrinho();
</script>
</body>
</html>
